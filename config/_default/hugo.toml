baseURL = "https://gordon-landreth-photography.arts-link.com"
copyright = "© 2024 Gordon Landreth Photography"
defaultContentLanguage = "en"
# disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true
languageCode = "en"
timeZone = "America/Los_Angeles"
timeout = "120s"
title = ""

# A bare top-level `private` key does nothing in Hugo — it never reaches a
# page's .Params, only [params.*] does. See layouts/partials/head.html for
# why this isn't fixed with a [[cascade]]: `.Params.private` is also read by
# home.html to decide which albums appear in the grid, so cascading it true
# site-wide would fix the robots tag and empty the homepage in the same
# stroke. The actual fix lives entirely in the overridden head.html partial.

[params]
  defaultTheme = "dark"
  description = "The photo albums of Gordon Landreth's life."
  title = "Gordon Landreth Photography"
  [params.author]
    email = "ben@benstrawbridge.com"
    name = "Ben Strawbridge"
  [params.socialIcons]
    #facebook = "https://www.facebook.com/"
    #instagram = "https://www.instagram.com/"
    github = "https://github.com/arts-link/gordon-landreth-photography/"
    #youtube = "https://www.youtube.com/"
    #email = "mailto:ben@benstrawbridge.com"
    #website = "https://www.benstrawbridge.com"
    #mastodon = "https://example.com"
    #pixelfed = "https://example.com"
  [params.gallerydeluxe.watermark]
    image = "images/benstraw.png" # relative to /assets
    posx  = "right"                    # one of "left", "center", "right"
    posy  = "bottom"                  # one of "top", "center", "bottom"
# Social share card. Every page renders a second HTML output at og.html — a
# 1200x630 card styled with the site's own CSS. scripts/og-images.mjs
# screenshots those into static/og/. See `npm run og`.
[outputFormats.ogcard]
  mediaType = "text/html"
  baseName = "og"
  isHTML = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "ogcard"]
  page = ["HTML", "ogcard"]
  section = ["HTML"]

[imaging]
  quality = 75
  resampleFilter = "CatmullRom"
  [imaging.exif]
    disableDate = false
    disableLatLong = true
    includeFields = "ImageDescription|Orientation"

[module]
  [module.hugoVersion]
    min = "0.121.2"
  [[module.imports]]
    path = "github.com/nicokaiser/hugo-theme-gallery/v4"

[menu]
  [[menu.footer]]
    name = "Website by arts-link.com"
    url = "https://www.arts-link.com/?utm_source=gordon-landreth-photography&utm_medium=footer&utm_campaign=website"
    weight = 3


[services]
  [services.rss]
    limit = 100


