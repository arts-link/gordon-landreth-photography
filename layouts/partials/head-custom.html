<script>window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) }</script>

<!-- The only robots tag on the page. layouts/partials/head.html (a full
     override of the theme's own head.html) deliberately drops the stock
     Params.private conditional that used to emit a second, contradictory
     one — see the comment there for why Params.private couldn't just be
     fixed instead. -->
<meta name="robots" content="noindex, nofollow" />

{{ if eq .Layout "search" }}
<!-- Preload search index for better performance -->
<link rel="preload" href="/search/search-index.json" as="fetch" crossorigin="anonymous">
{{ end }}
